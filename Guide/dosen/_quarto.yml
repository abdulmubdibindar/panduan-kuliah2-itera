project:
  type: book
  output-dir: _book
  brand: assets/brand.yml

book:
  title: "Panduan Penggunaan Platform *New E-Learning* ITERA"
  subtitle: "Dosen"
  date: "2026-08-27"
  output-file: "Panduan-Moodle-ITERA-Dosen"
  chapters:
    - index.qmd
    - pengesahan.qmd
    - 01-login-orientasi.qmd
    - 02-mata-kuliah.qmd
    - 03-kepesertaan-kelas-dan-peran.qmd
    - 04-organisasi-materi-dan-asesmen.qmd
    - 05-pemantauan-dan-laporan.qmd

lang: id
date-format: "D MMMM YYYY"

language:
  toc-title-document: "Daftar Isi"
  callout-note-title: "Catatan"
  callout-tip-title: "Kiat Praktis"
  callout-warning-title: "Peringatan"
  callout-important-title: "Perhatian"
  callout-caution-title: "Peringatan"
  section-title-footnotes: "Catatan Kaki"

crossref:
  chapters: true

format:
  typst:
    papersize: a4
    page-numbering: "1"
    toc: true
    toc-depth: 3
    toc-indent: 1.5em
    number-sections: true
    callout-icon: true
    mainfont: "Carlito"
    sansfont: "Playfair Display"
    monofont: "JetBrains Mono"
    font-paths:
      - assets/fonts
    fontsize: 11pt
    margin:
      x: 25mm
      y: 25mm
    include-in-header:
      - assets/typst-header.typ
    template-partials:
      - ../_shared/typst/typst-template.typ
      - ../_shared/typst/typst-show.typ
    keep-typ: true
